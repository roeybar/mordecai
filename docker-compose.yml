name: mordecai-toolkit

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATE_POLICY: ${GATE_POLICY:-strict}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-4000}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5}
      ANTHROPIC_GATE_MODEL: ${ANTHROPIC_GATE_MODEL:-claude-haiku-5-5}
      XAI_MODEL: ${XAI_MODEL:-grok-4.20-0309-non-reasoning}
      XAI_MODELS: ${XAI_MODELS:-grok-4.20-0309-non-reasoning,grok-4.20-0309-reasoning,grok-4.3,grok-4.7}
      XAI_GATE_MODEL: ${XAI_GATE_MODEL:-grok-4.20-0309-non-reasoning}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-3.6-flash,gemini-3.5-flash-lite}
      GEMINI_GATE_MODEL: ${GEMINI_GATE_MODEL:-gemini-3.5-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-6-luna,gpt-6.1-sol}
      OPENAI_GATE_MODEL: ${OPENAI_GATE_MODEL:-gpt-6-luna}
      FRAMES_DIR: ${FRAMES_DIR:-}
      HOSTED_PROVIDER: ${HOSTED_PROVIDER:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  check:
    profiles: [tools]
    build:
      context: .
      dockerfile: tools/Dockerfile
    volumes:
      - ./:/src
    network_mode: none
    mem_limit: 256m

  e2e:
    profiles: [tools]
    build: ./e2e
    environment:
      BASE_URL: http://web:8080
    volumes:
      - ./e2e/report:/e2e/report
    mem_limit: 1g
